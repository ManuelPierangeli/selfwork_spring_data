<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="${title}">Title</title>
</head>

<body class="bg-light">

    <main class="container py-5">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="h3 fw-bold text-dark mb-1">Tutti gli autori</h1>
                        <p class="text-muted mb-0">Elenco completo degli autori registrati nel sistema</p>
                    </div>
                    <div>
                        <a th:href="@{/authors/create}" class="btn btn-primary">
                            Add Author
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped mb-0 align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th scope="col" class="py-3 ps-4">ID</th>
                                        <th scope="col" class="py-3">Nome</th>
                                        <th scope="col" class="py-3 pe-4">Cognome</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="author : ${authors}">
                                        <th th:text="${author.id}" scope="row" class="ps-4"></th>
                                        <td th:text="${author.name}"></td>
                                        <td th:text="${author.surname}" class="pe-4"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
