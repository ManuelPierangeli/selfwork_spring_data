<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="${title}">Title</title>
</head>

<body class="bg-light">

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold text-dark mb-1">Tutti i Post</h1>
                <p class="text-muted mb-0">Elenco completo dei post pubblicati</p>
            </div>
            <a th:href="@{/posts/create}" class="btn btn-primary">Add Post</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive mb-0">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Titolo</th>
                            <th>Autore</th>
                            <th class="pe-4 text-end">Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="post : ${posts}">
                            <td class="ps-4 fw-semibold" th:text="${post.id}"></td>
                            <td th:text="${post.title}"></td>
                            <td th:text="${post.authorName}"></td>
                            <td class="pe-4 text-end">
                                <form th:action="@{/posts/delete}" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${post.id}" />
                                    <button type="submit" class="btn btn-danger btn-sm">Elimina</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
