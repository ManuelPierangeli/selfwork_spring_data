<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="${title}">Title</title>
</head>

<body class="bg-light">

    <main class="container py-5">
        <section class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 fw-bold text-dark mb-1">Add an Author</h1>
                        <p class="text-muted mb-0">Inserisci i dati del nuovo autore</p>
                    </div>
                    <a th:href="@{/authors}" class="btn btn-outline-secondary btn-sm">
                        Home
                    </a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/authors}" method="POST" th:object="${author}">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required>
                            </div>
                            <div class="mb-3">
                                <label for="firstname" class="form-label">Name</label>
                                <input type="text" class="form-control" id="firstname" th:field="*{name}" required>
                            </div>
                            <div class="mb-4">
                                <label for="lastname" class="form-label">Surname</label>
                                <input type="text" class="form-control" id="lastname" th:field="*{surname}" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success py-2">Save</button>
                                <button type="reset" class="btn btn-outline-danger py-2">Reset</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
