<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="${title}">Title</title>
</head>

<body class="bg-light">

    <main class="container py-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0 p-4">
            <h1 class="h3 fw-bold text-dark mb-3">Crea un nuovo Commento</h1>

            <form th:action="@{/comments}" th:object="${comment}" method="post">
                
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Testo del commento</label>
                    <textarea class="form-control" rows="3" th:field="*{body}" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Data</label>
                    <input type="text" class="form-control" th:field="*{date}" placeholder="es. 2026-06-06" required />
                </div>
                <div class="mb-4">
                    <label class="form-label">Post</label>
                    <select class="form-select" th:field="*{post.id}" required>
                        <option value="">Seleziona un post...</option>
                        <option th:each="post : ${posts}" 
                                th:value="${post.id}" 
                                th:text="${post.title}">
                        </option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/comments}" class="btn btn-secondary">Indietro</a>
                    <button type="submit" class="btn btn-success">Salva Commento</button>
                </div>

            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
